<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | JoinVLSI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header with logo -->
  <header>
    <img src="assets/logo.png" alt="Join VLSI Logo" width="200" />
    <nav>
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="testimonials.html">Testimonials</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Banner for Contact -->
  <section class="contact-banner">
    <img src="assets/banner.jpg" alt="VLSI Banner" width="100%" />
    <div class="banner-text">
      <h1>Contact Us</h1>
      <p>Have questions or want to enroll? Reach out to us!</p>
    </div>
  </section>

  <!-- Contact Form Section -->
  <section class="contact">
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <textarea name="message" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <div class="contact-info">
      <p>Email: <a href="mailto:info@joinvlsi.in">info@joinvlsi.in</a></p>
      <p>WhatsApp: <a href="https://wa.me/919704488449" target="_blank">Chat with Us</a></p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2025 Join VLSI | All Rights Reserved</p>
  </footer>

</body>
</html>
